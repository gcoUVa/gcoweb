  image: https://onofre4.tel.uva.es/news/20241204_concesion_ayudas/featured_huc42becb747592e49adedbc9dc8a230a7_516970_720x2500_fit_q90_h2_lanczos_3.webp
  title: "Subvenciones MICIU/AEI concedidas a ONOFRE-4"
  subtitle: "Novedades de proyecto de investigación"
  author: GCO-UVa  
  description: "El 4 de diciembre de 2024, la página web de la Agencia Estatal de Investigación publicó la orden por la que se conceden las ayudas correspondientes a la convocatoria 2023 de Proyectos de Generación de Conocimiento. En el marco de esta convocatoria, el proyecto ONOFRE-4 ha obtenido las siguientes ayudas: PID2023-148104OB-C41 (a la Universidad de Valladolid), PID2023-148104OB-C42 (a la Universidad Politécnica de Cartagena) y PID2023-148104OB-C43 (a la Universidad de Murcia). Estas subvenciones están financiadas por MICIU/AEI/10.13039/501100011033 y por el FEDER/UE."
  date: "2024-12-04"
  categories: [Proyecto, Óptica, Vehicular]

- path: https://onofre4.tel.uva.es/news/20250120_workshop_vtc2025/
  image: https://onofre4.tel.uva.es/news/20250120_workshop_vtc2025/featured_hua39953f62025d471d2efbab9bf3003e1_200899_720x2500_fit_q90_h2_lanczos_3.webp
  title: "Workshop C4CPS en VTC2025-Spring"
  subtitle: "Organización de Workshop"
  author: GCO-UVa  
  description: "El profesor Ramón J. Durán Barroso (del equipo de la UVa en ONOFRE-4), junto con Estefanía Coronado y Estela Carmona-Cejudo (i2CAT) y otros colaboradores, está coorganizando el taller IEEE sobre comunicación convergente, Computación y Control para Sistemas Ciberfísicos de Próxima Generación (C4CPS) en la 101.ª Conferencia de Tecnología Vehicular IEEE 2025 (VTC2025-Spring). La VTC2025-Spring se celebrará en Oslo, Noruega, del 17 al 20 de junio de 2025. Esta conferencia semestral insignia de la Sociedad de Tecnología Vehicular del IEEE reunirá a personas del mundo académico, gubernamental e industrial para debatir e intercambiar ideas en los campos de la tecnología inalámbrica, móvil y vehicular."
  date: "2025-01-25"
  categories: [Proyecto, Óptica, Vehicular, Radiocomunicaciones]


