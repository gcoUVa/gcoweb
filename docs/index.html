<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo…</title>

  <!-- No indexar esta página de redirección -->
  <meta name="robots" content="noindex">

  <!-- URL canónica de la página de destino -->
  <link rel="canonical" href="es/">

  <script>
    (function() {
      // Obtiene la URL completa actual
      const currentUrl = window.location.href;
      const currentOrigin = window.location.origin;
      let pathname = window.location.pathname;

      // Si termina en index.html, lo eliminamos
      if (pathname.endsWith("index.html")) {
        pathname = pathname.slice(0, -"index.html".length);
      }

      // Aseguramos que termine con "/"
      if (!pathname.endsWith("/")) {
        pathname += "/";
      }

      // Construimos la URL de redirección a "es/"
      const redirectUrl = currentOrigin + pathname + "es/";

      // Redirigimos reemplazando la URL actual
      window.location.replace(redirectUrl);
    })();
  </script>

  <noscript>
    <!-- Fallback relativo si JS está deshabilitado -->
    <meta http-equiv="refresh" content="0; url=es/">
  </noscript>
</head>
<body>
  <p>Redirigiendo a <a href="es/">es/</a>…</p>
</body>
</html>
