<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo...</title>
  <script>
    // Obtiene la base del repo desde la URL actual
    const currentPath = window.location.pathname; // e.g., "/gcoweb/"
    // Asegurarse de que termina con "/"
    const basePath = currentPath.endsWith("/") ? currentPath : currentPath + "/";
    // Redirige a "en/" dentro del mismo subdirectorio
    window.location.replace(basePath + "en/");
  </script>
  <noscript>
    <!-- Fallback para navegadores sin JS -->
    <meta http-equiv="refresh" content="0; url=en/">
  </noscript>
</head>
<body>
  <p>Redirigiendo a <a href="en/">en/</a>…</p>
</body>
</html>
