- path: https://sway.cloud.microsoft/yq1ifPqyzyppxaKi?ref=Link
  image: /files/images/projects/artemis.png
  title: "ARTEMIS"
  subtitle: "Proyecto Regional (2020-2023)"
  #author: UVa 
  description: "El proyecto ARTEMIS ha estudiado y propuesto soluciones para que las futuras redes de comunicaciones puedan soportar servicios de vehículos conectados. Esto requiere la integración de la computación periférica en las redes de comunicaciones. Varias tecnologías parecen facilitar esta evolución: redes ópticas avanzadas tanto para segmentos de acceso como metropolitanos/troncales, métodos de control basados en redes definidas por software (SDN) y virtualización de funciones de red (NFV)."
  started: 2020
  ended: 2025
  categories: [Regional]


