- path: https://www.saludmentalzamora.com/proyecto-equisam/
  image: /images/projects/equisam.png
  title: "EQUISAM: Accesibilidad y equidad de atención en salud mental a la población rural en la zona fronteriza. Desde la cooperación a la innovación"
  subtitle: "Proyecto Europeo (2024-2026)"
  description: "A través de este proyecto, y con la experiencia piloto de Zamora, se pretende implementar un modelo de atención comunitaria que haga accesible la salud mental en todos los centros de salud de cuidados primarios en ambos lados de la frontera, para lo cual se utilizarán nuevas tecnologías y se establecerá un plan de actuación y sostenibilidad que promoverá la coordinación y soporte compartido entre los servicios."
  started: 2024
  ended: 2026
  categories: [European] 