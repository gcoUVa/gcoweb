  image: https://onofre4.tel.uva.es/news/20241204_concesion_ayudas/featured_huc42becb747592e49adedbc9dc8a230a7_516970_720x2500_fit_q90_h2_lanczos_3.webp
  title: "MICIU/AEI grants awarded to ONOFRE-4"
  subtitle: "Research Project Update"
  author: GCO-UVa  
  description: "On 4th December 2024, the website of the Agencia Estatal de Investigación (State Research Agency) published the order granting funding under the 2023 call for Proyectos de Generación de Conocimiento (Knowledge Generation Projects). As part of this, the ONOFRE-4 project has been awarded the following grants: PID2023-148104OB-C41 (to Universidad de Valladolid), PID2023-148104OB-C42 (to Universidad Politécnica de Cartagena), and PID2023-148104OB-C43 (to Universidad de Murcia). These grants are funded by MICIU/AEI/10.13039/501100011033 and by ERDF/EU."
  date: "2024-12-04"
  categories: [Project, Optical, Vehicular]

- path: https://onofre4.tel.uva.es/news/20250120_workshop_vtc2025/
  image: https://onofre4.tel.uva.es/news/20250120_workshop_vtc2025/featured_hua39953f62025d471d2efbab9bf3003e1_200899_720x2500_fit_q90_h2_lanczos_3.webp
  title: "C4CPS Workshop at VTC2025-Spring"
  subtitle: "Workshop organization"
  author: GCO-UVa  
  description: "Prof. Ramón J. Durán Barroso (from the UVa team at ONOFRE-4), along Estefanía Coronado and Estela Carmona-Cejudo (i2CAT) and other collaborators, is co-organizing the IEEE Workshop on Converged Communication, Computing, and Control for Next-Generation Cyber-Physical Systems (C4CPS) at the 2025 IEEE 101st Vehicular Technology Conference (VTC2025-Spring). VTC2025-Spring will be held in Oslo, Norway, 17 - 20 June 2025. This semi-annual flagship conference of IEEE Vehicular Technology Society will bring together individuals from academia, government, and industry to discuss and exchange ideas in the fields of wireless, mobile and vehicular technology."
  date: "2025-01-25"
  categories: [Project, Optical, Vehicular, Radiocommunications]


