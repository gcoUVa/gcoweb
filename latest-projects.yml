  subtitle: "Regional project (2020-2023)"
  description: "The ARTEMIS project has studied and proposed solutions to enable future communications networks to support connected vehicle services. This requires the integration of edge computing into communications networks. Several technologies appear to facilitate this evolution: advanced optical networks for both access and metropolitan/backbone segments, control methods based on software-defined networks (SDN) and network function virtualisation (NFV)."
